name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Links da documentação (Markdown)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verificar links relativos dos .md
        run: node scripts/check-md-links.mjs

  functions:
    name: Dossiê de Despedida (PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Testar a geração do PDF (pdf-lib, sem Deno)
        run: node scripts/test-dossie.mjs

  kyc_engine:
    name: Zero-Trust KYC Engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kyc_engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "kyc_engine/requirements.txt"
      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Suíte Forense & Red Team (pytest)
        run: python -m pytest tests/ -v

  flutter:
    name: Analyze & Test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes (com cobertura)
        run: flutter test --coverage

      - name: Publicar cobertura (lcov)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore
