name: desperrengue_app
description: "Desperrengue: marketplace de serviços residenciais."
publish_to: "none"
version: 2.10.1+202611123

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.2
  camera: ^0.12.1
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.5.4
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  lottie: ^3.6.1
  package_info_plus: ^10.2.2
  permission_handler: ^13.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon_padded.png"
  adaptive_icon_background: "assets/icons/app_icon_background.png"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/app_icon_monochrome.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon_padded.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_padded.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon_padded.png"

flutter:
  uses-material-design: true

  assets:
    - assets/splash/logo.png

# Splash NATIVA (renderizada pelo Android/iOS antes do Flutter subir; sem tela branca).
# Mesmo azul-noite Quiet Luxury (#0F172A) da animacao nos temas claro e escuro. Gerar com:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0F172A"
  image: assets/splash/logo.png
  android_12:
    color: "#0F172A"
    image: assets/splash/logo.png
  fullscreen: false

# So para a GERACAO da splash: flutter_native_splash -> image 4.11 + archive 4.3 nao compilam juntos.
# Fixar image 4.5.4 + archive 4.0.7 resolve (nao afeta o app em runtime).
dependency_overrides:
  archive: 4.0.7
  image: 4.5.4
