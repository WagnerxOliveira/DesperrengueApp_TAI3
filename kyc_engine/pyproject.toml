[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "desperrengue-kyc-engine"
version = "2.9.0"
description = "Desperrengue Zero-Trust KYC & Document Forensics Microservice (Gemini 4 Argon High + Carbon High)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    "asn1crypto>=1.5.1",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "zxing-cpp>=2.2.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "qrcode>=7.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
